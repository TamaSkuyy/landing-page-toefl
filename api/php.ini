; Konfigurasi PHP untuk function Vercel (dipakai runtime vercel-php saat build).
;
; `variables_order` wajib memuat E supaya environment variable Vercel (APP_KEY, DB_*, dst)
; muncul di $_ENV — sebagian setup PHP produksi memakai "GPCS" sehingga $_ENV kosong dan
; `env()` hanya bisa membaca dari $_SERVER.
;
; Nilai ini tidak dipakai di VPS/shared hosting.

memory_limit = 512M
variables_order = "EGPCS"

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256

expose_php = Off
