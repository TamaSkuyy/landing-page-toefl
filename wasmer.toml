# Deployment Laravel ke Wasmer Edge.
# Panduan resmi: https://docs.wasmer.io/edge/guides/laravel
#
# Alur singkat:
#     composer install --no-dev --optimize-autoloader
#     npm ci && npm run build
#     wasmer run .        # uji lokal lewat runtime Wasmer → http://localhost:8080
#     wasmer deploy
#
# PENTING — `[fs] "/app/" = "."` memetakan SELURUH direktori proyek apa adanya, bukan dari
# git. Jadi `vendor/` dan `public/build/` ikut terkirim meski keduanya ada di .gitignore;
# pastikan keduanya sudah dibangun di lokal sebelum deploy.
#
# Versi paket PHP mengikuti panduan resmi Wasmer (`php/php = "=8.3.4"`).
# Aplikasi ini kompatibel PHP 8.3 karena `composer.json` memakai `config.platform.php = 8.3.0`
# sehingga `composer.lock` dikunci ke Symfony 7.4 (bukan Symfony 8 yang butuh PHP >= 8.4.1).

[dependencies]
"php/php" = "=8.3.4"

[fs]
# Direktori aplikasi (docroot Laravel ada di /app/public).
"/app/" = "."
# Konfigurasi PHP (php.ini + prepend.php), dipakai lewat PHPRC di bawah.
"/wasmer" = "wasmer"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
# Ekuivalen dengan: php -t /app/public -S localhost:8080
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
env = ["PHPRC=/wasmer/"]
