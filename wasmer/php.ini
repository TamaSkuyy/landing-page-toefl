; Konfigurasi PHP untuk Wasmer Edge, dimuat lewat PHPRC=/wasmer/ (lihat wasmer.toml).
; Referensi: https://docs.wasmer.io/edge/guides/php#custom-php-settings

; `variables_order` harus memuat E supaya environment variable / secrets Wasmer terlihat
; oleh env() Laravel (banyak setup produksi memakai "GPCS" sehingga $_ENV kosong).
variables_order = "EGPCS"

memory_limit = 512M
expose_php = Off

; Instans di Edge didaur ulang, jadi validasi timestamp tidak diperlukan.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.max_file_size = 0
opcache.memory_consumption = 192

; Dijalankan pada setiap request: mengarahkan path tulis Laravel ke filesystem sementara
; karena direktori aplikasi di Edge bersifat read-only/sementara.
auto_prepend_file = /wasmer/prepend.php

upload_max_filesize = 20M
post_max_size = 25M
